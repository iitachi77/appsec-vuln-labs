# The process half of the fix: a CI gate so "debug on + vulnerable dep" can never ship again.
# GitHub Actions example.
name: security-gate

on: [push, pull_request]

jobs:
  deps-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # SCA: fail the build on any known-vulnerable dependency (catches facade/ignition 2.5.1).
      - name: composer audit
        run: composer audit --no-interaction

      # Config gate: refuse to ship a production build with debug enabled.
      - name: Assert APP_DEBUG is not true in committed env files
        run: |
          if grep -R -nE '^\s*APP_DEBUG\s*=\s*true' .env* 2>/dev/null; then
            echo "::error::APP_DEBUG=true found in an env file — refusing to build."
            exit 1
          fi
          echo "OK: no APP_DEBUG=true in committed env files."

      # (Optional) add a SAST step here too, e.g. Psalm/PHPStan security rules or Semgrep.
