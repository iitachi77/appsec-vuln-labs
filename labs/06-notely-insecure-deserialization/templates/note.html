{% extends "base.html" %}
{% block title %}Notely — {{ note.title }}{% endblock %}
{% block body %}
<div class="shell">
  {% set active = none %}
  {% include "_sidebar.html" %}
  <div class="main">
    <a class="back" href="{{ url_for('dashboard') }}">← Back to dashboard</a>
    <div class="panel">
      <div class="hd" style="margin:0 0 10px">
        <h1>{{ note.title }}</h1>
        <p>Saved at {{ note.ts }}</p>
      </div>
      <p style="font-size:15px;line-height:1.7;white-space:pre-wrap">{{ note.body }}</p>
    </div>
  </div>
</div>
{% endblock %}
